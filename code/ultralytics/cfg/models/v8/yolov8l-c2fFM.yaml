# YOLOv8l — 方式2: 使用 C2f_FM 替换全部 C2f 模块
#
# 改动说明:
#   backbone 第2/4/6/8层 + head 第12/15/18/21层: C2f → C2f_FM
#   C2f_FM 将内部 Bottleneck 替换为 Bottleneck_FM（FM自适应调制），
#   其余结构（cv1 / chunk / cv2 / 残差拼接）与原版 C2f 完全一致，
#   parse_model 对 n（重复次数）的 depth_multiple 缩放同样生效。
#
# 参数格式: [out_channels, shortcut, focal_levels, focal_window]
#   out_channels : 输出通道数
#   shortcut     : Bottleneck 内是否使用残差（True/False）
#   focal_levels : FM 层级数，默认 3
#   focal_window : 首层 DWConv kernel，默认 3
#
# 策略说明:
#   - backbone 浅层（P2: 128ch）感受野要求低，focal_levels=2 即可
#   - backbone 中深层（P3~P5）及 neck 全部使用 focal_levels=3
#   - head 中的 C2f_FM 不使用 shortcut（与原版 head C2f 一致）
#
# 需要在 tasks.py 中注册 C2f_FM（参见接入说明.md）

# Parameters
nc: 5
scales:
  l: [1.00, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,    [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,    [128, 3, 2]]             # 1-P2/4
  - [-1, 3, C2f,     [128, True]]      # 2  ← P2 浅层用2级
  - [-1, 1, Conv,    [256, 3, 2]]             # 3-P3/8
  - [-1, 6, C2f,     [256, True]]      # 4  ← P3
  - [-1, 1, Conv,    [512, 3, 2]]             # 5-P4/16
  - [-1, 6, C2f_FM,  [512, True, 2, 3]]      # 6  ← P4
  - [-1, 1, Conv,    [1024, 3, 2]]            # 7-P5/32
  - [-1, 3, C2f_FM,  [1024, True, 2, 3]]     # 8  ← P5
  - [-1, 1, SPPF,    [1024, 5]]              # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                 # cat backbone P4
  - [-1, 3, C2f_FM,  [512, False, 2, 3]]     # 12 ← neck P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                 # cat backbone P3
  - [-1, 3, C2f,  [256]]     # 15 (P3/8-small)

  - [-1, 1, Conv,    [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]                # cat head P4
  - [-1, 3, C2f,  [512]]     # 18 (P4/16-medium)

  - [-1, 1, Conv,    [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]                 # cat head P5
  - [-1, 3, C2f,  [1024]]    # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]           # Detect(P3, P4, P5)
# YOLOv8l — 解耦检测头版本
# 
# 设计思路:
#   P3 (80×80) → 只检测 bleed（小目标，病斑）
#   P4 (40×40) + P5 (20×20) → 只检测鱼类（perch, tilapia, snakehead）
#
# 实现方式:
#   使用两个独立的 Detect 头，各自有独立的 nc 和 loss
#   DetectFish: nc=1, 检测 [perch]
#   DetectBleed: nc=3, 检测 [bleed, badeye, fungal]
#
# 注意：需要配合修改后的 tasks.py 和 loss.py

nc: 5
nc_fish:  1
nc_lesion: 4

scales:
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 3, C2f,  [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 6, C2f,  [256, True]]          # 4  ← P3 特征，给 bleed 头
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 6, C2f,  [512, True]]          # 6  ← P4 特征，给鱼头
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 3, C2f,  [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9  ← P5 特征，给鱼头

head:
  # ── 上采样到 P3 ────────────────────────────────────────────
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11  cat P4
  - [-1, 3, C2f, [512]]                        # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14  cat P3
  - [-1, 3, C2f, [256]]                        # 15  ← P3 融合特征（给 bleed）

  # ── 下采样回 P4、P5 ────────────────────────────────────────
  - [-1, 1, Conv, [256, 3, 2]]                 # 16
  - [[-1, 12], 1, Concat, [1]]                 # 17  cat P4
  - [-1, 3, C2f, [512]]                        # 18  ← P4 融合特征（给鱼）

  - [-1, 1, Conv, [512, 3, 2]]                 # 19
  - [[-1, 9], 1, Concat, [1]]                  # 20  cat P5
  - [-1, 3, C2f, [1024]]                       # 21  ← P5 融合特征（给鱼）

  # ── 解耦检测头 ─────────────────────────────────────────────
  # lesion 专用头：只用 P3，只检测 lesion（nc=1）
  - [[15], 1, DetectLesion, [nc_lesion]]          # 22  P3 → bleed

  # 鱼类专用头：P4+P5，检测三种鱼（nc=3）
  - [[18, 21], 1, DetectFish, [nc_fish]]        # 23  P4+P5 → fish